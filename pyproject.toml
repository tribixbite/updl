[tool.poetry]
name = "updl"
version = "3.0.0"
description = "Resumable, verifiable archiver for UniFi Protect footage"
authors = ["Will Stone <willstone@gmail.com>"]
maintainers = ["Will Stone <willstone@gmail.com>"]
license = "MIT"

readme = "README.md"

# The distribution is 'updl'; the import package keeps its original name so that fixes
# from the upstream project this forks can still be merged rather than hand-ported.
packages = [
    { include = "protect_archiver"}
]

homepage = "https://github.com/tribixbite/updl"
repository = "https://github.com/tribixbite/updl"
documentation = "https://github.com/tribixbite/updl#readme"

keywords = ["unifi", "protect", "nvr", "video", "archive", "backup", "ubiquiti"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/tribixbite/updl/issues"
"Upstream project" = "https://github.com/danielfernau/unifi-protect-video-downloader"


[tool.poetry.dependencies]
python = "^3.10"
python-dateutil = "^2.9.0"
requests = {extras = ["security"], version = "^2.33.0"}
click = "^8.1.8"
types-python-dateutil = "^2.9.0"
types-requests = "^2.32.0"


[tool.poetry.group.dev.dependencies]
black = "*"
codecov = "*"
flake8 = "*"
isort = "^5.13.2"
mypy = "*"
pytest = "*"
pytest-cov = "*"
pylint = "*"
responses = "*"
pytest-responses = "*"
pytest-xdist = "*"


[tool.poetry.scripts]
updl = 'protect_archiver.cli:main'
# Kept so existing scripts and scheduled tasks written against the upstream name keep
# working after an upgrade.
protect-archiver = 'protect_archiver.cli:main'


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.isort]
py_version = 310
profile = "black"
force_single_line = true
combine_as_imports = true
lines_between_types = 1
lines_after_imports = 2
src_paths = ["protect_archiver", "tests"]


[tool.black]
line-length = 100
force-exclude = '''
.*/setup\.py$
'''


[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true
files = "protect_archiver"


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:"
]
