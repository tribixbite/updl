[project]
name = "updl"
version = "3.0.1"
description = "Resumable, verifiable archiver for UniFi Protect footage"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<4.0"

authors = [
    { name = "Will Stone", email = "willstone@gmail.com" },
]

keywords = ["unifi", "protect", "nvr", "video", "archive", "backup", "ubiquiti"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]

dependencies = [
    "python-dateutil (>=2.9.0,<3.0.0)",
    "requests[security] (>=2.33.0,<3.0.0)",
    "click (>=8.1.8,<9.0.0)",
]

[project.urls]
Homepage = "https://github.com/tribixbite/updl"
Repository = "https://github.com/tribixbite/updl"
Documentation = "https://github.com/tribixbite/updl#readme"
"Bug Tracker" = "https://github.com/tribixbite/updl/issues"
"Upstream project" = "https://github.com/danielfernau/unifi-protect-video-downloader"

[project.scripts]
updl = "protect_archiver.cli:main"
# Kept so anything already scheduled against the upstream name keeps working.
protect-archiver = "protect_archiver.cli:main"


[tool.poetry]
# The distribution is 'updl'; the import package keeps its original name so that fixes
# from the upstream project this forks can still be merged rather than hand-ported.
packages = [
    { include = "protect_archiver" },
]


[tool.poetry.group.dev.dependencies]
black = "26.5.1"
flake8 = "*"
isort = "^5.13.2"
mypy = "*"
pytest = "*"
pytest-cov = "*"
pylint = "*"
responses = "*"
pytest-responses = "*"
pytest-xdist = "*"
# Type stubs are needed only to type-check this project, never at runtime.
types-python-dateutil = "^2.9.0"
types-requests = "^2.32.0"


[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.isort]
py_version = 310
profile = "black"
force_single_line = true
combine_as_imports = true
lines_between_types = 1
# Left to black: it and isort disagree about the gap before a module-level comment.
lines_after_imports = -1
src_paths = ["protect_archiver", "tests"]


[tool.black]
line-length = 100
force-exclude = '''
.*/setup\.py$
'''


[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true
files = "protect_archiver"


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:"
]
